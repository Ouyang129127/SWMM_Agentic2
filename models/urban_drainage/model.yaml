notes: >-
  The repository was imported as one model project. cenario_01 through cenario_11
  are represented as scenarios under the same project because they share the
  drainage-system identity and differ in simulation inputs or scenario data.
  The synthetic CA2D surface uses SWMM junction cover elevations, the union of
  the user's registered orange modelling boundary as its active domain,
  cross-checked against 218 SWMM subcatchment polygons. Roads are 8 m wide, continuous across polygon gaps, and lowered by 0.10 m;
  varied synthetic building footprints are raised by 15 m.
