<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>地表积水预览</title><style>body{background:#edf2ed;margin:0;color:#223d35;font:16px/1.9 "Microsoft YaHei",sans-serif}main{max-width:1100px;background:white;padding:40px;margin:30px auto}h1{font-size:25px}figure{margin:28px 0}img{width:100%;height:auto}figcaption,.sources{font-size:12px;color:#64776e}a{color:#087b72}</style><main><h1>地表淹没情况与演变</h1><p>地表积水的深度直接影响道路通行和周边环境。本报告参照中国工程建设标准化协会《内涝风险评估标准（征求意见稿）》，以15、27和40厘米为界，将积水深度的风险划分为低、中、较高、高四级。同时，采用北京市水务局积水内涝风险地图的划分口径，将水深不足15厘米的区域称为轻微积水，达到15厘米的区域纳入内涝分析。15厘米接近常见道路路缘石的高度，积水达到这一范围后，路面和车道位置更难辨认，行人和车辆的通行隐患随之增加。</p><p class="sources">分级依据：<a href="http://www.cecs.org.cn/uploads/soft/240223/1-240223145239.pdf">CECS《内涝风险评估标准（征求意见稿）》</a>；<a href="https://www.bjdch.gov.cn/ztzl/2023ndcqaqdxfw/xqfw/202307/t20230731_3210896.html">北京市水务局《北京城市积水内涝风险地图》</a></p><figure><img src="assets/surface_maps.png"><figcaption>模拟过程中各位置的最大水深与模拟结束时的水深。颜色由浅黄至深红表示水深增加。</figcaption></figure><figure><img src="assets/surface_process.png"><figcaption>地表积水面积、内涝面积和最大水深的变化。虚线表示降雨结束。</figcaption></figure><figure><img src="assets/surface_stages.png"><figcaption>地表积水从出现、扩展到雨停及模拟结束的阶段变化。</figcaption></figure></main></html>
